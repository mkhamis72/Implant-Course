name: Backup
on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 02:00/03:00 Cairo: backup
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st: verify (after that night's backup); a failure turns the run red
  workflow_dispatch:
    inputs:
      mode:
        description: 'backup, or verify (decrypt the latest backup and list its contents)'
        required: true
        default: backup
        type: choice
        options: [backup, verify]

permissions:
  contents: read
  actions: read

# The backup is data only: the schema comes from the migrations in this repo, and the restore in
# docs/operations.md loads this data onto a freshly migrated project. Sign-in accounts (auth schema)
# are included so restored profiles and records keep matching user ids: Supabase Auth (auth) and, since the
# Self-Auth switch-over, Self-Auth (self_auth). One database holds every company and the console (merge of control
# into production, release 3): one whole-database file, plus each company's own rows as JSON.

jobs:
  backup:
    if: github.event.schedule == '0 0 * * *' || inputs.mode == 'backup'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Install the newest PostgreSQL client (a newer pg_dump can read any older server)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Dump and encrypt the database and each company (the plain dump never touches disk)
        id: dump
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CA: ${{ secrets.PROD_DATABASE_CA_CERT }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PASSPHRASE="$(clean "$PASSPHRASE")"
          PROD_DATABASE_URL="$(clean "$PROD_DATABASE_URL")"
          CA="$(clean "$CA")"
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is missing: refusing to back up unencrypted"; exit 1; }
          test -n "$PROD_DATABASE_URL" || { echo "PROD_DATABASE_URL secret is missing"; exit 1; }
          test -n "$CA" || { echo "PROD_DATABASE_CA_CERT secret is missing"; exit 1; }
          printf '%s\n' "$CA" > "$RUNNER_TEMP/ca.crt"
          export PGSSLMODE=verify-full PGSSLROOTCERT="$RUNNER_TEMP/ca.crt"
          encrypt() { gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$PASSPHRASE" --output "$1"; }
          mkdir -p out
          day=$(date -u +%F)
          failed=()
          # The whole database once: every company, the console and both sign-in schemas. A failure is recorded and
          # the company exports still run; the run fails at the end.
          if ! "$PG_BIN/pg_dump" --data-only --format=custom --no-owner \
                 --schema=public --schema=app_private --schema=auth --schema=self_auth \
                 --exclude-table=app_private.schema_migrations --exclude-table=auth.schema_migrations \
                 "$PROD_DATABASE_URL" \
                 | encrypt "out/prod-$day.dump.gpg"; then
            rm -f "out/prod-$day.dump.gpg"
            failed+=("whole database")
          fi
          # Each company's own rows as JSON (company-export), restorable on its own (docs/operations.md section D).
          # The list comes from the database itself; only slug-shaped lines are kept.
          slugs=$(DATABASE_URL="$PROD_DATABASE_URL" DATABASE_CA_CERT="$RUNNER_TEMP/ca.crt" npm run --silent companies:list | grep -E '^[a-z0-9][a-z0-9-]*$' || true)
          if [ -z "$slugs" ]; then
            echo "No companies were listed"
            failed+=("company list")
          fi
          for slug in $slugs; do
            rc=0
            ( set -euo pipefail
                   DATABASE_URL="$PROD_DATABASE_URL" DATABASE_CA_CERT="$RUNNER_TEMP/ca.crt" npm run --silent company:export -- --company "$slug" --out - \
                     | encrypt "out/$slug-$day.company.dump.gpg" ) || rc=$?
            if [ "$rc" -ne 0 ]; then
              rm -f "out/$slug-$day.company.dump.gpg"
              failed+=("$slug (company export)")
            fi
          done
          ls -l out
          printf '%s\n' "${failed[@]}" > "$RUNNER_TEMP/failed.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: backups-${{ github.run_id }}
          path: web/out/*.dump.gpg
          retention-days: 14
          if-no-files-found: error
      # A second copy outside GitHub, kept a year. The bucket's lifecycle rule deletes files after 365 days and its
      # Bucket Lock rule refuses deleting or overwriting them before that, even with this key (docs/operations.md §D).
      - name: Copy the encrypted files off-site (Cloudflare R2, kept a year)
        id: offsite
        continue-on-error: true # keep-awake still runs; the final step fails the run
        env:
          RUN_ID: ${{ github.run_id }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          R2_ENDPOINT="$(clean "$R2_ENDPOINT")"
          R2_BUCKET="$(clean "$R2_BUCKET")"
          AWS_ACCESS_KEY_ID="$(clean "$AWS_ACCESS_KEY_ID")"
          AWS_SECRET_ACCESS_KEY="$(clean "$AWS_SECRET_ACCESS_KEY")"
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            || { echo "R2 secrets are missing"; exit 1; }
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
          # R2 doesn't take the newer AWS CLI's default request checksums.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          prefix="$(date -u +%F)/$RUN_ID"
          aws s3 cp out/ "s3://$R2_BUCKET/$prefix/" --recursive --exclude '*' --include '*.dump.gpg' \
            --endpoint-url "$R2_ENDPOINT" --no-progress
      - name: Keep the production project awake (auth health check)
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PROD_SUPABASE_URL="$(clean "$PROD_SUPABASE_URL")"
          PROD_ANON_KEY="$(clean "$PROD_ANON_KEY")"
          woke_failed=()
          # Missing secrets are recorded, not fatal here: the file is always written and the last step reports it.
          if [ -z "$PROD_SUPABASE_URL" ] || [ -z "$PROD_ANON_KEY" ]; then
            echo "PROD_SUPABASE_URL / PROD_ANON_KEY secrets are missing"
            woke_failed+=("production (secrets missing)")
          else
            curl --fail --silent --show-error "$PROD_SUPABASE_URL/auth/v1/health" -H "apikey: $PROD_ANON_KEY" -o /dev/null \
              || woke_failed+=(production)
          fi
          printf '%s\n' "${woke_failed[@]}" > "$RUNNER_TEMP/keepawake-failed.txt"
      - name: Fail if any backup or keep-awake check failed
        if: ${{ !cancelled() }}
        env:
          DUMP_OUTCOME: ${{ steps.dump.outcome }}
          OFFSITE_OUTCOME: ${{ steps.offsite.outcome }}
        run: |
          if [ "$DUMP_OUTCOME" != "success" ]; then echo "Backup did not run: the dump step failed."; exit 1; fi
          failed=""; woke_failed=""; offsite_failed=""
          [ -f "$RUNNER_TEMP/failed.txt" ] && failed=$(grep -v '^$' "$RUNNER_TEMP/failed.txt" || true)
          [ -f "$RUNNER_TEMP/keepawake-failed.txt" ] && woke_failed=$(grep -v '^$' "$RUNNER_TEMP/keepawake-failed.txt" || true)
          [ "$OFFSITE_OUTCOME" = "success" ] || offsite_failed=1
          [ -z "$failed" ] || echo "Backup failed for: $(echo $failed)"
          [ -z "$woke_failed" ] || echo "Keep-awake failed for: $(echo $woke_failed)"
          [ -z "$offsite_failed" ] || echo "Off-site copy failed or did not run ($OFFSITE_OUTCOME): see the 'Copy the encrypted files off-site' step."
          if [ -n "$failed$woke_failed$offsite_failed" ]; then exit 1; fi
          echo "The database and every company were backed up."

  verify:
    if: github.event.schedule == '0 6 1 * *' || inputs.mode == 'verify'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install the newest PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Download the latest backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # backups-* since part 3; prod-backup-* is the older single-company name (kept 14 days).
          latest=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("backups-")) or (.name | startswith("prod-backup-"))) | select(.expired == false)] | sort_by(.created_at) | last | "\(.workflow_run.id) \(.name)"')
          read -r run_id name <<<"$latest"
          test -n "${name:-}" && test "$name" != "null" || { echo "No backup artifact found"; exit 1; }
          echo "Verifying $name"
          gh run download "$run_id" --repo "${{ github.repository }}" --name "$name" --dir in
      - name: Download the latest off-site set (Cloudflare R2)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          R2_ENDPOINT="$(clean "$R2_ENDPOINT")"
          R2_BUCKET="$(clean "$R2_BUCKET")"
          AWS_ACCESS_KEY_ID="$(clean "$AWS_ACCESS_KEY_ID")"
          AWS_SECRET_ACCESS_KEY="$(clean "$AWS_SECRET_ACCESS_KEY")"
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            || { echo "R2 secrets are missing"; exit 1; }
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          # Nightly sets are stored as <date>/<run id>/<file>; pre-release ones (Release) as <date>/<run id>-<attempt>/
          # and hold no company exports. The newest nightly file names the newest nightly set.
          newest=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
            --query 'sort_by(Contents, &LastModified)[].Key' --output text \
            | tr '\t' '\n' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]+/' | tail -1 || true)
          test -n "$newest" && test "$newest" != "None" || { echo "No off-site backup found"; exit 1; }
          prefix=$(dirname "$newest")
          echo "Verifying off-site $prefix"
          aws s3 cp "s3://$R2_BUCKET/$prefix/" offsite/ --recursive --endpoint-url "$R2_ENDPOINT" --no-progress
      - name: Decrypt and list every file of both copies (fails if one is unreadable or missing patients, accounts or companies)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PASSPHRASE="$(clean "$PASSPHRASE")"
          bad=()
          shopt -s nullglob
          CHECK_EXPORT='const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const t = d && d.tables;
            const ok = typeof d.company_id === "string" && !Number.isNaN(Date.parse(d.exported_at))
              && t && Array.isArray(t["public.patients"])
              && (d.format === "company-export-v2" ? (d.company && typeof d.company === "object" && Array.isArray(t["self_auth.user"]))
                : (d.format === "company-export-v1" && Array.isArray(t["auth.users"])));
            if (!ok) process.exit(1);
            console.log(Object.keys(t).length + " tables, exported_at " + d.exported_at);'
          # The slugs of the whole dump's public.companies rows (COPY text: the slug column of each row).
          SLUGS_FROM_COPY='const lines = require("fs").readFileSync(0, "utf8").split("\n");
            const h = lines.findIndex((l) => l.startsWith("COPY public.companies ("));
            if (h < 0) process.exit(1);
            const cols = lines[h].slice(lines[h].indexOf("(") + 1, lines[h].indexOf(")")).split(",").map((c) => c.trim().replace(/"/g, ""));
            const i = cols.indexOf("slug");
            if (i < 0) process.exit(1);
            const out = [];
            for (const l of lines.slice(h + 1)) { if (l === "\\.") break; out.push(l.split("\t")[i]); }
            console.log(out.filter((x) => /^[a-z0-9][a-z0-9-]*$/.test(x)).join("\n"));'
          # in = the GitHub artifact, offsite = the R2 copy; each must be complete on its own.
          for dir in in offsite; do
            whole_files=0; company_files=0
            for f in "$dir"/*.dump.gpg; do
              name="$dir/$(basename "$f" .dump.gpg)"
              # A company's own JSON export (company-export): parsed as a whole (a truncated file fails), with its format,
              # company, export time and the company's patients and accounts. ubuntu-latest ships Node.
              case "$(basename "$f")" in *.company.dump.gpg)
                if ! gpg --batch --pinentry-mode loopback --decrypt --passphrase-fd 3 3<<<"$PASSPHRASE" "$f" > "$RUNNER_TEMP/check.dump" \
                   || ! info=$(node -e "$CHECK_EXPORT" "$RUNNER_TEMP/check.dump"); then
                  bad+=("$name: company export unreadable or incomplete")
                else
                  echo "$name: $info"
                  company_files=$((company_files + 1))
                fi
                continue ;;
              esac
              whole_files=$((whole_files + 1))
              if ! gpg --batch --pinentry-mode loopback --decrypt --passphrase-fd 3 3<<<"$PASSPHRASE" "$f" > "$RUNNER_TEMP/check.dump" \
                 || ! "$PG_BIN/pg_restore" --list "$RUNNER_TEMP/check.dump" > "$RUNNER_TEMP/list.txt"; then
                bad+=("$name: unreadable"); continue
              fi
              echo "$name: $(grep -c 'TABLE DATA' "$RUNNER_TEMP/list.txt") tables with data"
              # The whole database (prod-*; sets from before the merge also held a registry file, not checked here).
              grep -q "TABLE DATA public patients" "$RUNNER_TEMP/list.txt" || bad+=("$name: patients missing")
              grep -q "TABLE DATA auth users" "$RUNNER_TEMP/list.txt" || bad+=("$name: sign-in accounts missing")
              grep -q "TABLE DATA self_auth user" "$RUNNER_TEMP/list.txt" || bad+=("$name: Self-Auth accounts missing")
              grep -q "TABLE DATA public companies" "$RUNNER_TEMP/list.txt" || bad+=("$name: companies missing")
              # Every company in the dump has its own export in the same set (compgen: nullglob would hide a miss).
              if slugs=$("$PG_BIN/pg_restore" --data-only --table=companies -f - "$RUNNER_TEMP/check.dump" | node -e "$SLUGS_FROM_COPY"); then
                for slug in $slugs; do
                  compgen -G "$dir/$slug-*.company.dump.gpg" > /dev/null || bad+=("$dir: $slug company export missing")
                done
              else
                bad+=("$name: company list unreadable")
              fi
            done
            [ "$whole_files" -gt 0 ] || bad+=("$dir: whole-database file missing")
            [ "$company_files" -gt 0 ] || bad+=("$dir: no company exports")
          done
          rm -f "$RUNNER_TEMP/check.dump"
          if [ ${#bad[@]} -gt 0 ]; then printf 'Backup problem: %s\n' "${bad[@]}"; exit 1; fi
          echo "Every backup is readable and complete, in GitHub and off-site."

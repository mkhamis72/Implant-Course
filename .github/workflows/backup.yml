name: Backup
on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 02:00/03:00 Cairo: backup
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st: verify (after that night's backup); a failure turns the run red
  workflow_dispatch:
    inputs:
      mode:
        description: 'backup, or verify (decrypt the latest backup and list its contents)'
        required: true
        default: backup
        type: choice
        options: [backup, verify]

permissions:
  contents: read
  actions: read

# The backup is data only: the schema comes from the migrations in this repo, and the restore in
# docs/operations.md loads this data onto a freshly migrated project. Sign-in accounts (auth schema)
# are included so restored profiles and records keep matching user ids.

jobs:
  backup:
    if: github.event.schedule == '0 0 * * *' || inputs.mode == 'backup'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Install the newest PostgreSQL client (a newer pg_dump can read any older server)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Export the companies from the control project (secrets masked)
        id: export
        env:
          CONTROL_DATABASE_URL: ${{ secrets.CONTROL_DATABASE_URL }}
          CONTROL_SUPABASE_URL: ${{ secrets.CONTROL_SUPABASE_URL }}
          CA: ${{ secrets.PROD_DATABASE_CA_CERT }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          CONTROL_DATABASE_URL="$(clean "$CONTROL_DATABASE_URL")"
          CONTROL_SUPABASE_URL="$(clean "$CONTROL_SUPABASE_URL")"
          CA="$(clean "$CA")"
          test -n "$CONTROL_DATABASE_URL" && test -n "$CA" || { echo "Control database secrets are missing"; exit 1; }
          printf '%s\n' "$CA" > "$RUNNER_TEMP/ca.crt"
          CONTROL_DATABASE_URL="$CONTROL_DATABASE_URL" CONTROL_SUPABASE_URL="$CONTROL_SUPABASE_URL" \
            DATABASE_CA_CERT="$RUNNER_TEMP/ca.crt" npm run tenants:export -- --dir "$RUNNER_TEMP/tenants"
      - name: Dump and encrypt each company and the control registry (the plain dump never touches disk)
        id: dump
        env:
          CONTROL_DATABASE_URL: ${{ secrets.CONTROL_DATABASE_URL }}
          CA: ${{ secrets.PROD_DATABASE_CA_CERT }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PASSPHRASE="$(clean "$PASSPHRASE")"
          CONTROL_DATABASE_URL="$(clean "$CONTROL_DATABASE_URL")"
          CA="$(clean "$CA")"
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is missing: refusing to back up unencrypted"; exit 1; }
          test -n "$CONTROL_DATABASE_URL" && test -n "$CA" || { echo "Database secrets are missing"; exit 1; }
          printf '%s\n' "$CA" > "$RUNNER_TEMP/ca.crt"
          export PGSSLMODE=verify-full PGSSLROOTCERT="$RUNNER_TEMP/ca.crt"
          encrypt() { gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$PASSPHRASE" --output "$1"; }
          shopt -s nullglob
          files=("$RUNNER_TEMP"/tenants/*.env)
          [ ${#files[@]} -gt 0 ] || { echo "No companies were exported"; exit 1; }
          mkdir -p out
          day=$(date -u +%F)
          failed=()
          declare -A dumped=()
          for f in "${files[@]}"; do
            slug=$(basename "$f" .env)
            key=$(set -euo pipefail; source "$f"; printf '%s' "$DB_KEY") || key=""
            [ -n "$key" ] || { echo "No DB_KEY for $slug"; failed+=("$slug"); continue; }
            # Companies in one database (same DB_KEY) share one whole-database dump, taken for the first of them;
            # if it fails, the next company on that database retries it. A failed company is recorded and the
            # others are still backed up; the run fails at the end.
            if [ -z "${dumped[$key]:-}" ]; then
              if ( set -euo pipefail; source "$f"
                   "$PG_BIN/pg_dump" --data-only --format=custom --no-owner \
                     --schema=public --schema=app_private --schema=auth \
                     --exclude-table=app_private.schema_migrations --exclude-table=auth.schema_migrations \
                     "$DATABASE_URL" \
                     | encrypt "out/$SLUG-$day.dump.gpg" ); then
                dumped[$key]="$slug"
              else
                rm -f "out/$slug-$day.dump.gpg"
                failed+=("$slug")
              fi
            fi
            # Each company's own rows as JSON (company-export), restorable on its own (docs/operations.md section D).
            # company:export exits 3 for a tenant without a company id (register it with --company or --provision).
            rc=0
            ( set -euo pipefail
                   DATABASE_CA_CERT="$RUNNER_TEMP/ca.crt" npm run --silent company:export -- --tenant "$slug" --out - \
                     | encrypt "out/$slug-$day.company.dump.gpg" ) || rc=$?
            if [ "$rc" -ne 0 ]; then
              rm -f "out/$slug-$day.company.dump.gpg"
              if [ "$rc" -eq 3 ]; then failed+=("$slug (no company id in the control project)"); else failed+=("$slug (company export)"); fi
            fi
          done
          if ! "$PG_BIN/pg_dump" --data-only --format=custom --no-owner --table=public.tenants --table=public.tenant_audit \
                 "$CONTROL_DATABASE_URL" \
                 | encrypt "out/_control-$day.dump.gpg"; then
            rm -f "out/_control-$day.dump.gpg"
            failed+=(control)
          fi
          ls -l out
          printf '%s\n' "${failed[@]}" > "$RUNNER_TEMP/failed.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: backups-${{ github.run_id }}
          path: web/out/*.dump.gpg
          retention-days: 14
          if-no-files-found: error
      # A second copy outside GitHub, kept a year. The bucket's lifecycle rule deletes files after 365 days and its
      # Bucket Lock rule refuses deleting or overwriting them before that, even with this key (docs/operations.md §D).
      - name: Copy the encrypted files off-site (Cloudflare R2, kept a year)
        id: offsite
        continue-on-error: true # keep-awake still runs; the final step fails the run
        env:
          RUN_ID: ${{ github.run_id }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          R2_ENDPOINT="$(clean "$R2_ENDPOINT")"
          R2_BUCKET="$(clean "$R2_BUCKET")"
          AWS_ACCESS_KEY_ID="$(clean "$AWS_ACCESS_KEY_ID")"
          AWS_SECRET_ACCESS_KEY="$(clean "$AWS_SECRET_ACCESS_KEY")"
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            || { echo "R2 secrets are missing"; exit 1; }
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
          # R2 doesn't take the newer AWS CLI's default request checksums.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          prefix="$(date -u +%F)/$RUN_ID"
          aws s3 cp out/ "s3://$R2_BUCKET/$prefix/" --recursive --exclude '*' --include '*.dump.gpg' \
            --endpoint-url "$R2_ENDPOINT" --no-progress
      - name: Keep every company and the control project awake (auth health check)
        env:
          CONTROL_SUPABASE_URL: ${{ secrets.CONTROL_SUPABASE_URL }}
          CONTROL_ANON_KEY: ${{ secrets.CONTROL_ANON_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          CONTROL_SUPABASE_URL="$(clean "$CONTROL_SUPABASE_URL")"
          CONTROL_ANON_KEY="$(clean "$CONTROL_ANON_KEY")"
          woke_failed=()
          # Missing secrets are recorded, not fatal here: the company pings still run and the file is always written.
          control_ok=1
          if [ -z "$CONTROL_SUPABASE_URL" ] || [ -z "$CONTROL_ANON_KEY" ]; then
            echo "CONTROL_SUPABASE_URL / CONTROL_ANON_KEY secrets are missing"
            woke_failed+=("control (secrets missing)")
            control_ok=0
          fi
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/tenants/*.env; do
            ( source "$f"; curl --fail --silent --show-error "$SUPABASE_URL/auth/v1/health" -H "apikey: $ANON_KEY" -o /dev/null ) \
              || woke_failed+=("$(basename "$f" .env)")
          done
          if [ "$control_ok" = 1 ]; then
            curl --fail --silent --show-error "$CONTROL_SUPABASE_URL/auth/v1/health" -H "apikey: $CONTROL_ANON_KEY" -o /dev/null \
              || woke_failed+=(control)
          fi
          printf '%s\n' "${woke_failed[@]}" > "$RUNNER_TEMP/keepawake-failed.txt"
      - name: Fail if any backup or keep-awake check failed
        if: ${{ !cancelled() }}
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          DUMP_OUTCOME: ${{ steps.dump.outcome }}
          OFFSITE_OUTCOME: ${{ steps.offsite.outcome }}
        run: |
          if [ "$EXPORT_OUTCOME" != "success" ]; then echo "Backup did not run: the export step failed."; exit 1; fi
          if [ "$DUMP_OUTCOME" != "success" ]; then echo "Backup did not run: the dump step failed."; exit 1; fi
          failed=""; woke_failed=""; offsite_failed=""
          [ -f "$RUNNER_TEMP/failed.txt" ] && failed=$(grep -v '^$' "$RUNNER_TEMP/failed.txt" || true)
          [ -f "$RUNNER_TEMP/keepawake-failed.txt" ] && woke_failed=$(grep -v '^$' "$RUNNER_TEMP/keepawake-failed.txt" || true)
          [ "$OFFSITE_OUTCOME" = "success" ] || offsite_failed=1
          [ -z "$failed" ] || echo "Backup failed for: $(echo $failed)"
          [ -z "$woke_failed" ] || echo "Keep-awake failed for: $(echo $woke_failed)"
          [ -z "$offsite_failed" ] || echo "Off-site copy failed or did not run ($OFFSITE_OUTCOME): see the 'Copy the encrypted files off-site' step."
          if [ -n "$failed$woke_failed$offsite_failed" ]; then exit 1; fi
          echo "Every company and the control registry were backed up."

  verify:
    if: github.event.schedule == '0 6 1 * *' || inputs.mode == 'verify'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install the newest PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Download the latest backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # backups-* since part 3; prod-backup-* is the older single-company name (kept 14 days).
          latest=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("backups-")) or (.name | startswith("prod-backup-"))) | select(.expired == false)] | sort_by(.created_at) | last | "\(.workflow_run.id) \(.name)"')
          read -r run_id name <<<"$latest"
          test -n "${name:-}" && test "$name" != "null" || { echo "No backup artifact found"; exit 1; }
          echo "Verifying $name"
          gh run download "$run_id" --repo "${{ github.repository }}" --name "$name" --dir in
      - name: Download the latest off-site set (Cloudflare R2)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          R2_ENDPOINT="$(clean "$R2_ENDPOINT")"
          R2_BUCKET="$(clean "$R2_BUCKET")"
          AWS_ACCESS_KEY_ID="$(clean "$AWS_ACCESS_KEY_ID")"
          AWS_SECRET_ACCESS_KEY="$(clean "$AWS_SECRET_ACCESS_KEY")"
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            || { echo "R2 secrets are missing"; exit 1; }
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          # Files are stored as <date>/<run id>/<file>; the newest file names the newest set.
          newest=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
            --query 'sort_by(Contents, &LastModified)[-1].Key' --output text)
          test -n "$newest" && test "$newest" != "None" || { echo "No off-site backup found"; exit 1; }
          prefix=$(dirname "$newest")
          echo "Verifying off-site $prefix"
          aws s3 cp "s3://$R2_BUCKET/$prefix/" offsite/ --recursive --endpoint-url "$R2_ENDPOINT" --no-progress
      - name: Decrypt and list every file of both copies (fails if one is unreadable or missing patients, accounts or companies)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PASSPHRASE="$(clean "$PASSPHRASE")"
          bad=()
          shopt -s nullglob
          # in = the GitHub artifact, offsite = the R2 copy; each must be complete on its own.
          for dir in in offsite; do
            control_files=0; company_files=0
            for f in "$dir"/*.dump.gpg; do
              name="$dir/$(basename "$f" .dump.gpg)"
              # A company's own JSON export (company-export): readable, and it holds the company's patients and accounts.
              case "$(basename "$f")" in *.company.dump.gpg)
                if ! gpg --batch --pinentry-mode loopback --decrypt --passphrase-fd 3 3<<<"$PASSPHRASE" "$f" > "$RUNNER_TEMP/check.dump" \
                   || ! grep -q '"format":"company-export-v1"' "$RUNNER_TEMP/check.dump" \
                   || ! grep -q '"public.patients"' "$RUNNER_TEMP/check.dump" || ! grep -q '"auth.users"' "$RUNNER_TEMP/check.dump"; then
                  bad+=("$name: company export unreadable or incomplete")
                fi
                continue ;;
              esac
              case "$(basename "$f")" in _control-*) control_files=$((control_files + 1)) ;; *) company_files=$((company_files + 1)) ;; esac
              if ! gpg --batch --pinentry-mode loopback --decrypt --passphrase-fd 3 3<<<"$PASSPHRASE" "$f" > "$RUNNER_TEMP/check.dump" \
                 || ! "$PG_BIN/pg_restore" --list "$RUNNER_TEMP/check.dump" > "$RUNNER_TEMP/list.txt"; then
                bad+=("$name: unreadable"); continue
              fi
              echo "$name: $(grep -c 'TABLE DATA' "$RUNNER_TEMP/list.txt") tables with data"
              case "$(basename "$f")" in
                _control-*) grep -q "TABLE DATA public tenants" "$RUNNER_TEMP/list.txt" || bad+=("$name: companies missing") ;;
                *) grep -q "TABLE DATA public patients" "$RUNNER_TEMP/list.txt" || bad+=("$name: patients missing")
                   grep -q "TABLE DATA auth users" "$RUNNER_TEMP/list.txt" || bad+=("$name: sign-in accounts missing") ;;
              esac
            done
            [ "$control_files" -gt 0 ] || bad+=("$dir: registry file missing")
            [ "$company_files" -gt 0 ] || bad+=("$dir: no company files")
          done
          rm -f "$RUNNER_TEMP/check.dump"
          if [ ${#bad[@]} -gt 0 ]; then printf 'Backup problem: %s\n' "${bad[@]}"; exit 1; fi
          echo "Every backup is readable and complete, in GitHub and off-site."

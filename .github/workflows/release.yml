name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      # Unit tests and the build-time config need a Supabase URL; these are placeholders, not secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # A build that would fail on Vercel must fail here, before the migration.
      - run: npm run build

  migrate-and-deploy:
    needs: check
    # Only master may change production (a manual run from another branch must not apply its migrations).
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Migrate production (verified TLS)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DATABASE_CA_CERT: ${{ secrets.PROD_DATABASE_CA_CERT }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "PROD_DATABASE_URL secret is missing"; exit 1; }
          test -n "$PROD_DATABASE_CA_CERT" || { echo "PROD_DATABASE_CA_CERT secret is missing"; exit 1; }
          printf '%s\n' "$PROD_DATABASE_CA_CERT" > "$RUNNER_TEMP/prod-ca.crt"
          DATABASE_CA_CERT="$RUNNER_TEMP/prod-ca.crt" npm run db:migrate
      - name: Deploy on Vercel (only after a successful migration)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$HOOK" || { echo "VERCEL_DEPLOY_HOOK_URL secret is missing"; exit 1; }
          # The hook builds master's tip. If master has moved on, that newer commit's own release run
          # migrates first and then deploys; deploying now would ship its code before its migration.
          tip=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "master is now at $tip (this run migrated $GITHUB_SHA); leaving the deploy to that release."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Vercel deployment triggered."

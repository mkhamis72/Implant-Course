name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      # Unit tests and the build-time config need a Supabase URL; these are placeholders, not secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # A build that would fail on Vercel must fail here, before the migration.
      - run: npm run build

  migrate-and-deploy:
    needs: check
    # Only master may change production (a manual run from another branch must not apply its migrations).
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # A restore point before every migration (owner's rule): the one production database (every company and the
      # console), schema and data, sign-in accounts included (auth and self_auth), encrypted, as an artifact and in R2.
      # Every step here fails the job on any error, so the migration and the deploy below never run without it.
      - name: Install the newest PostgreSQL client (a newer pg_dump can read any older server)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Back up the production database before migrating (encrypted, all or nothing)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CA: ${{ secrets.PROD_DATABASE_CA_CERT }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PASSPHRASE="$(clean "$PASSPHRASE")"
          PROD_DATABASE_URL="$(clean "$PROD_DATABASE_URL")"
          CA="$(clean "$CA")"
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is missing: refusing to back up unencrypted"; exit 1; }
          test -n "$PROD_DATABASE_URL" || { echo "PROD_DATABASE_URL secret is missing"; exit 1; }
          test -n "$CA" || { echo "PROD_DATABASE_CA_CERT secret is missing"; exit 1; }
          printf '%s\n' "$CA" > "$RUNNER_TEMP/ca.crt"
          export PGSSLMODE=verify-full PGSSLROOTCERT="$RUNNER_TEMP/ca.crt"
          encrypt() { gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$PASSPHRASE" --output "$1"; }
          mkdir -p out
          day=$(date -u +%F)
          # Same name as the nightly whole-database file (prod-<date>), so Backup's verify reads it too. Schema and
          # data: the state just before this release's migrations. A failed dump stops the job here.
          "$PG_BIN/pg_dump" --format=custom --no-owner \
            --schema=public --schema=app_private --schema=app --schema=auth --schema=self_auth \
            "$PROD_DATABASE_URL" \
            | encrypt "out/prod-$day.dump.gpg"
          ls -l out
          echo "Pre-release backup: $(cd out && ls *.dump.gpg | tr '\n' ' ')"
      - uses: actions/upload-artifact@v7
        with:
          name: pre-release-backups-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/out/*.dump.gpg
          retention-days: 14
          if-no-files-found: error
      - name: Copy the pre-release backup off-site (Cloudflare R2, kept a year)
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          R2_ENDPOINT="$(clean "$R2_ENDPOINT")"
          R2_BUCKET="$(clean "$R2_BUCKET")"
          AWS_ACCESS_KEY_ID="$(clean "$AWS_ACCESS_KEY_ID")"
          AWS_SECRET_ACCESS_KEY="$(clean "$AWS_SECRET_ACCESS_KEY")"
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            || { echo "R2 secrets are missing"; exit 1; }
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          # The attempt is in the prefix: a re-run can't overwrite the first attempt's locked files.
          prefix="$(date -u +%F)/$RUN_ID"
          aws s3 cp out/ "s3://$R2_BUCKET/$prefix/" --recursive --exclude '*' --include '*.dump.gpg' \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          echo "Off-site: $prefix"
      - name: Migrate the production database (verified TLS)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DATABASE_CA_CERT: ${{ secrets.PROD_DATABASE_CA_CERT }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          PROD_DATABASE_URL="$(clean "$PROD_DATABASE_URL")"
          PROD_DATABASE_CA_CERT="$(clean "$PROD_DATABASE_CA_CERT")"
          test -n "$PROD_DATABASE_URL" || { echo "PROD_DATABASE_URL secret is missing"; exit 1; }
          test -n "$PROD_DATABASE_CA_CERT" || { echo "PROD_DATABASE_CA_CERT secret is missing"; exit 1; }
          printf '%s\n' "$PROD_DATABASE_CA_CERT" > "$RUNNER_TEMP/prod-ca.crt"
          # One database holds every company and the console (merge of control into production, release 3).
          export DATABASE_URL="$PROD_DATABASE_URL" DATABASE_CA_CERT="$RUNNER_TEMP/prod-ca.crt"
          npm run db:migrate
      - name: Deploy on Vercel (only after a successful migration)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          HOOK="$(clean "$HOOK")"
          test -n "$HOOK" || { echo "VERCEL_DEPLOY_HOOK_URL secret is missing"; exit 1; }
          # The hook builds master's tip. If master has moved on, that newer commit's own release run
          # migrates first and then deploys; deploying now would ship its code before its migration.
          tip=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "master is now at $tip (this run migrated $GITHUB_SHA); leaving the deploy to that release."
            exit 0
          fi
          # No build cache (Vercel's documented ?buildCache=false): the vendored @mkhamis72/self-auth tarball has no
          # lockfile integrity hash, so a cached copy must never stand in for the one in this commit.
          curl --fail --silent --show-error -X POST "$HOOK?buildCache=false" > /dev/null
          echo "Vercel deployment triggered."
